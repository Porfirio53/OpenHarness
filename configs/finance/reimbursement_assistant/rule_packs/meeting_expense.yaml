        table: TABLE 29
        row: R0007
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: meeting.invoice.tax.items.split
    category: consistency
    description: 多种服务应按服务类型分别或分行分税目开票。
    applies_when:
      operator: all
      operands:
        - {operator: eq, fact: multiple_service_types, value: true}
        - {operator: eq, fact: invoice_tax_items_split, value: false}
    required_items: [corrected_invoice_or_approved_explanation]
    severity: review
    user_message: 当前发票包含多类服务，请核对分行分税目要求并转财务复核。
    conflict_key: meeting_invoice_tax_consistency
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
