rules:
  - rule_id: meeting.invoice.required
    category: attachment
    description: 会议费报账需要提供与业务类型相符的发票。
    applies_when: null
    required_items: [invoice]
    severity: blocking
    user_message: 请按票据形态补充会议费用发票。
    conflict_key: meeting_invoice_requirement
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: 会议费/报账材料要求
        table: TABLE 28
        row: R0003
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: meeting.contract.order.conditional
    category: attachment
    description: 存在合同时需要关联或提供合同及采购订单。
    applies_when: {operator: eq, fact: has_contract, value: true}
    required_items: [contract_or_order]
    severity: blocking
    user_message: 当前会议事项存在合同，请关联或补充合同及采购订单。
    conflict_key: meeting_contract_requirement
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: 会议费/报账材料要求
        table: TABLE 28
        row: R0004
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: meeting.notice.required
    category: attachment
    description: 会议费报账需要会议通知，内容应与申请保持一致。
    applies_when: null
    required_items: [meeting_notice]
    severity: blocking
    user_message: 请补充与会议申请内容一致的会议通知。
    conflict_key: meeting_notice_requirement
    source_refs:
      - &manual_meeting_preapproval
        document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: 会议费/报账材料要求
        table: TABLE 28
        row: R0005
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: meeting.internal.preapproval.required
    category: attachment
    description: 公司组织的会议需要关联会议费事前申请单。
    applies_when: {operator: eq, fact: external_meeting, value: false}
    required_items: [meeting_preapproval]
    severity: blocking
    user_message: 公司组织会议请关联会议费事前申请单。
    conflict_key: meeting_preapproval_requirement
    source_refs: [*manual_meeting_preapproval]

  - rule_id: meeting.internal.attendance.required
    category: attachment
    description: 公司组织的会议需要提供可核对日期和人数的签到记录。
    applies_when: {operator: eq, fact: external_meeting, value: false}
    required_items: [attendance_sheet]
    severity: blocking
    user_message: 请补充能够展示参会日期和人数的签到记录。
    conflict_key: meeting_attendance_requirement
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: 会议费/报账材料要求
        table: TABLE 28
        row: R0006
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: meeting.hotel.list.required
    category: attachment
    description: 公司组织会议发生酒店费用时需要酒店有效公章费用清单。
    applies_when:
      operator: all
      operands:
        - {operator: eq, fact: external_meeting, value: false}
        - {operator: eq, fact: hotel_expense_incurred, value: true}
    required_items: [stamped_hotel_expense_list]
    severity: blocking
    user_message: 请补充加盖酒店有效公章的费用清单。
    conflict_key: meeting_hotel_list_requirement
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: 会议费/报账材料要求
        table: TABLE 28
        row: R0007
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: meeting.personal.advance.payment.required
    category: attachment
    description: 个人垫付金额超过5000元时需要支付记录。
    applies_when: {operator: gt, fact: personal_advance_amount, value: 5000}
    required_items: [payment_evidence]
    severity: blocking
    user_message: 个人垫付金额超过5000元，请补充支付记录。
    conflict_key: meeting_personal_advance_requirement
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: 会议费/报账材料要求
        table: TABLE 28
        row: R0008
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: meeting.headcount.difference.explanation
    category: consistency
    description: 酒店清单人数与参会人数不一致时需要差异原因。
    applies_when: {operator: eq, fact: headcount_matches, value: false}
    required_items: [headcount_difference_explanation]
    severity: review
    user_message: 酒店清单人数与参会人数不一致，请说明差异原因。
    conflict_key: meeting_headcount_consistency
    source_refs:
      - &manual_external_exception
        document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: 会议费/报账注意事项
        table: TABLE 29
        row: R0006
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: meeting.external.material.exception
    category: classification
    description: 参加外部单位组织会议时无需本公司签到表和酒店费用清单。
    applies_when: {operator: eq, fact: external_meeting, value: true}
    required_items: [external_meeting_confirmation]
    severity: warning
    user_message: 已按外部会议例外处理，请保留能够证明会议主办方的通知。
    conflict_key: meeting_external_exception
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
