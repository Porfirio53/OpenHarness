rules:
  - rule_id: it.reporting.mode.formal.only
    category: classification
    description: 首月规则包仅支持正式报账，计提和冲销需要转未覆盖流程。
    applies_when: {operator: in, fact: reporting_mode, value: [accrual, reversal]}
    required_items: [formal_reporting_mode]
    severity: blocking
    user_message: 当前MVP只支持正式报账，计提或冲销请转人工或后续规则包。
    conflict_key: it_reporting_mode_scope
    source_refs:
      - document_id: reimbursement_assistant_mvp_scope
        title: 报账助手 MVP 系统边界 ADR-0001
        document_version: "2026-07-16"
        effective_date: null
        section: 决策
        locator: 首月MVP三个场景边界
        content_checksum: sha256:ff240ce97102a26fbb237c190b76198d5134c0bbcf209cb3a26bdd3d96a67f41

  - rule_id: it.domain.clarification.required
    category: classification
    description: 未确认IT域别时需要澄清B、M、O、IT云或其他维护支撑。
    applies_when: {operator: exists, fact: it_domain, value: false}
    required_items: [it_domain_clarification]
    severity: review
    user_message: 请确认相关系统属于B域、M域、O域、IT云或其他IT维护支撑。
    conflict_key: it_domain_classification
    source_refs: [*manual_domain_definitions]

  - rule_id: it.invoice.required
    category: attachment
    description: IT维护支撑费正式报账需要发票。
    applies_when: {operator: eq, fact: reporting_mode, value: formal}
    required_items: [invoice]
    severity: blocking
    user_message: 请按票据形态补充IT维护支撑费发票。
    conflict_key: it_invoice_requirement
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: IT维护支撑费/报账材料要求
        table: TABLE 44
        row: R0003
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: it.contract.order.required
    category: attachment
    description: IT维护支撑费正式报账需要关联或提供合同及采购订单。
    applies_when: {operator: eq, fact: reporting_mode, value: formal}
    required_items: [contract_or_order]
    severity: blocking
    user_message: 请关联或补充合同及采购订单。
    conflict_key: it_contract_order_requirement
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
