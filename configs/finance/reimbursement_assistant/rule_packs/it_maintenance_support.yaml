        row: R0005
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: it.contract.evidence.conditional
    category: attachment
    description: 合同付款条款约定的验收、考核、请款等材料需要随单提供。
    applies_when: {operator: eq, fact: contract_additional_evidence_required, value: true}
    required_items: [contract_evidence]
    severity: blocking
    user_message: 请按合同付款条款补充验收、考核、请款或其他约定材料。
    conflict_key: it_contract_evidence_requirement
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
