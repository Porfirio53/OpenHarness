  - rule_id: it.signed.settlement.required
    category: attachment
    description: IT维护支撑费正式报账需要双方签字或盖章的结算单。
    applies_when: {operator: eq, fact: reporting_mode, value: formal}
    required_items: [signed_settlement]
    severity: blocking
    user_message: 请补充双方签字或盖章的费用结算单。
    conflict_key: it_signed_settlement_requirement
    source_refs:
      - &manual_settlement
        document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: IT维护支撑费/报账材料要求
