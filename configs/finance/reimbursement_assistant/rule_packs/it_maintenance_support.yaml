        table: TABLE 44
        row: R0006
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: it.settlement.information.complete
    category: field
    description: 结算单需要包含合同订单标识、服务内容、数量、单价和金额等信息。
    applies_when: {operator: eq, fact: settlement_information_complete, value: false}
    required_items: [settlement_calculation_details]
    severity: blocking
    user_message: 结算单关键信息不完整，请补充详细计算明细和过程。
    conflict_key: it_settlement_information
    source_refs: [*manual_settlement]

  - rule_id: it.order.contract.consistent
    category: consistency
    description: 采购订单和结算单的服务内容、单价应与合同价格清单一致。
    applies_when: {operator: eq, fact: order_contract_terms_consistent, value: false}
    required_items: [contract_order_correction]
    severity: blocking
    user_message: 合同、采购订单或结算单的服务内容和单价不一致，请修正或补充依据。
    conflict_key: it_order_contract_consistency
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: IT维护支撑费/报账注意事项
        table: TABLE 45
        row: R0003-R0005
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: it.amounts.consistent
    category: consistency
    description: 报账、发票、付款及支撑材料金额原则上应保持一致。
    applies_when: {operator: eq, fact: amounts_consistent, value: false}
    required_items: [amount_difference_resolution]
    severity: review
    user_message: 金额存在差异，请按差异类型修正材料或补充经审批说明。
    conflict_key: it_amount_consistency
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: IT维护支撑费/报账注意事项
        table: TABLE 45
        row: R0007
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: it.payment.account.consistent
    category: consistency
    description: 收款账号原则上应与合同约定结算账号一致。
    applies_when: {operator: eq, fact: contract_account_matches, value: false}
    required_items: [account_change_evidence]
    severity: review
    user_message: 收款账号与合同不一致，请补充合同约定的变更材料或盖章付款说明。
    conflict_key: it_payment_account_consistency
