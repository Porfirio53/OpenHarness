boundary: 员工在常驻地以外的境内公务出差；不含港澳台、境外差旅和商旅平台统一结算单独报账。

classification:
  aliases: [国内差旅, 境内出差, 差旅费报销, 公务出差]
  positive_signals: [出差, 机票, 火车票, 住宿费, 市内交通费]
  exclusion_signals: [出国, 境外, 港澳台, 商旅统结]
  clarification_questions:
    - 本次是否为员工在境内常驻地以外执行公务产生的费用？
    - 本次费用是否由商旅平台统一结算？
  source_refs:
