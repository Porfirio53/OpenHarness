        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: travel.invoice.lines.consistent
    category: consistency
    description: 非统结发票行金额应与对应费用行合计保持一致。
    applies_when: {operator: eq, fact: invoice_line_amounts_consistent, value: false}
    required_items: [amount_difference_resolution]
    severity: review
    user_message: 发票行与费用行金额不一致，请核对并说明或修正差异。
    conflict_key: travel_invoice_line_consistency
    source_refs:
