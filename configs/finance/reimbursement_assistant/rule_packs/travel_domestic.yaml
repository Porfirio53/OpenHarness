rules:
  - rule_id: travel.application.offline.required
    category: attachment
    description: 线下差旅申请必须提供差旅事前审批单。
    applies_when: {operator: eq, fact: platform_application, value: false}
    required_items: [travel_application]
    severity: blocking
    user_message: 请补充已审批的线下差旅事前审批单。
    conflict_key: travel_application_requirement
    source_refs:
      - &manual_travel_materials
        document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: 国内差旅费报销/报账材料要求
        table: TABLE 4
        row: R0003
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: travel.invoice.non_centralized.required
    category: attachment
    description: 非商旅统结费用需要提供对应发票。
    applies_when: {operator: eq, fact: centralized_settlement, value: false}
    required_items: [invoice]
    severity: blocking
    user_message: 请按票据形态补充非商旅统结发票。
    conflict_key: travel_invoice_requirement
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: 国内差旅费报销/报账材料要求
        table: TABLE 4
        row: R0004
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: travel.taxi.itinerary.required
    category: attachment
    description: 第三方平台打车且发票未注明行程时需要电子行程单。
    applies_when:
      operator: all
      operands:
        - {operator: eq, fact: third_party_taxi, value: true}
        - {operator: eq, fact: invoice_has_route_note, value: false}
    required_items: [taxi_itinerary]
    severity: blocking
    user_message: 发票未注明行程起止地点和日期，请补充平台电子行程单。
    conflict_key: taxi_itinerary_requirement
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: 国内差旅费报销/报账材料要求
        table: TABLE 4
        row: R0005
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: travel.hotel.non_centralized.details.required
    category: attachment
    description: 非商旅平台统结酒店费用需要账单明细和支付凭证。
    applies_when: {operator: eq, fact: hotel_non_centralized, value: true}
    required_items: [hotel_statement, payment_evidence]
    severity: blocking
    user_message: 请补充酒店账单明细及对应支付凭证。
    conflict_key: hotel_non_centralized_requirement
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: 国内差旅费报销/报账材料要求
        table: TABLE 4
        row: R0006
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: travel.itinerary.change.explanation.required
    category: attachment
    description: 实际行程与申请不一致时需要经审批的情况说明。
    applies_when: {operator: eq, fact: itinerary_matches_application, value: false}
    required_items: [approved_special_explanation]
    severity: blocking
    user_message: 实际行程与申请不一致，请补充原因、处理方式和审批意见。
    conflict_key: travel_itinerary_change_requirement
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: 国内差旅费报销/报账材料要求
        table: TABLE 4
        row: R0007
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: travel.private.detour.comparison.required
    category: attachment
    description: 因私绕道需要直达票价比对和结果说明。
    applies_when: {operator: eq, fact: private_detour, value: true}
    required_items: [direct_fare_comparison, detour_explanation]
    severity: blocking
    user_message: 请提供直达票价截图，并说明绕道行程及比对结果。
    conflict_key: private_detour_requirement
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
        section: 国内差旅费报销/其他材料
        table: TABLE 4
        row: R0008
        content_checksum: sha256:88a697b64cf563a5f4e4e6f67b22e7179bdd6d6d86e4c1406dc96b57046430b6

  - rule_id: travel.cross_period.approval.required
    category: attachment
    description: 跨期或跨年报账需要相应审批说明。
    applies_when: {operator: eq, fact: cross_period_claim, value: true}
    required_items: [approved_cross_period_explanation]
    severity: review
    user_message: 当前属于跨期报账，请补充符合审批层级的跨期说明。
    conflict_key: travel_cross_period_requirement
    source_refs:
      - document_id: reimbursement_manual_cost_expense
        title: 报账手册（成本费用域分册）
        document_version: 2025V1
        effective_date: 2025-06-20
